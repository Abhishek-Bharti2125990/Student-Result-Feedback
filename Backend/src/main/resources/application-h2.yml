# ---------------------------------------------------------------------------
# `h2` profile: run the whole platform with nothing to install.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# Flyway picks up classpath:db/migration/h2 automatically because the location
# in application.yml is templated on {vendor}, so the schema created here is the
# same schema, written in H2's dialect.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:file:./data/srip;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
