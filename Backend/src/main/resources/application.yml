spring:
  application:
    name: student-result-intelligence

  # MySQL is the platform database. Create the schema once:
  #   CREATE DATABASE srip CHARACTER SET utf8mb4;
  # Flyway then owns every table inside it.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/srip?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never touches DDL.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    # {vendor} resolves to `mysql` or `h2` at runtime. The schema and the Spring
    # Batch metadata tables cannot be written in one dialect that both accept -
    # MySQL has no sequences and rejects TIMESTAMP(9) - so each vendor gets its
    # own DDL, while the reference data in `common` is portable and shared.
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
    baseline-on-migrate: true

  batch:
    jdbc:
      # The BATCH_* metadata tables are created by Flyway migration V3, not by
      # Boot, so that they are version controlled alongside everything else.
      initialize-schema: never
    job:
      # Jobs are launched by the upload endpoint, never automatically at startup.
      enabled: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8081
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # CHANGE THIS. Must be at least 32 characters (256 bits) for HS256.
    secret: ${JWT_SECRET:change-me-local-dev-secret-key-must-be-at-least-32-bytes-long}
    issuer: srip
    access-token-ttl: PT30M
    refresh-token-ttl: P7D

  upload:
    # Where uploaded CSV files are staged before the batch job reads them.
    directory: ./data/uploads

  grading:
    # Percentage floor -> grade. Evaluated highest floor first.
    bands:
      - { min-percentage: 90, grade: "A+", points: 10 }
      - { min-percentage: 80, grade: "A",  points: 9 }
      - { min-percentage: 70, grade: "B+", points: 8 }
      - { min-percentage: 60, grade: "B",  points: 7 }
      - { min-percentage: 50, grade: "C",  points: 6 }
      - { min-percentage: 40, grade: "D",  points: 5 }
      - { min-percentage: 0,  grade: "F",  points: 0 }
    pass-percentage: 40

    # Score categories used by the teacher dashboard:
    #   CRITICAL  below 50
    #   AVERAGE   50 to 70
    #   GOOD      70 to 85
    #   EXCELLENT above 85
    category-bounds:
      critical-below: 50
      average-below: 70
      good-below: 85

  analytics:
    # A subject/topic at or below this percentage is flagged weak.
    weak-subject-threshold: 50
    weak-topic-threshold: 50
    # A subject/topic at or above this percentage is flagged strong.
    strong-threshold: 75
    # Also flag a subject this many points below the student's own average.
    relative-weakness-margin: 15
    trend-min-exams: 2

  claude:
    # Read from the ANTHROPIC_API_KEY environment variable.
    # When blank the platform runs in rule-based fallback mode: every AI
    # endpoint still returns feedback, generated locally without a network call.
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5
    max-tokens: 8000
    timeout: PT120S
    enabled: true
    # Generate student and teacher feedback as the last step of a CSV import, so
    # the dashboards are populated before anyone opens them. Turn this off if
    # you would rather pay for a model call only when a dashboard is read.
    generate-on-import: true

  demo:
    # Creates one login per role on first start (see README for credentials).
    seed-users: true
    default-password: Passw0rd!

logging:
  level:
    com.srip: INFO
    org.springframework.batch: INFO
